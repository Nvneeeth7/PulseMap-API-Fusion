<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseMap — Kochi Local News</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
        }
        #header {
            height: 60px;
            background-color: #1e1e1e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #333;
        }
        #header h1 {
            font-size: 20px;
            margin: 0;
            color: #81B61C;
        }
        #header span {
            font-size: 13px;
            color: #aaa;
        }
        #map {
            height: calc(100vh - 60px);
            width: 100%;
        }
        .leaflet-popup-content-wrapper {
            background-color: #1e1e1e;
            color: #fff;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .leaflet-popup-tip {
            background-color: #1e1e1e;
        }
        .news-card {
            max-width: 250px;
        }
        .news-card .category {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #81B61C;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .news-card h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            line-height: 1.3;
            color: #ffffff;
        }
        .news-card p {
            margin: 0 0 8px 0;
            font-size: 12px;
            color: #ccc;
        }
        .news-card a {
            color: #4da6ff;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>🌍 PulseMap <span style="font-size: 12px; background: #2e3e1e; padding: 2px 6px; border-radius: 4px; margin-left: 8px;">Kochi Feed</span></h1>
        <span>OpenStreetMap + NewsAPI Fusion</span>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Initialize the map centered over Kochi, Kerala
        const map = L.map('map').setView([9.9816, 76.2999], 12);

        // Add OpenStreetMap dark mode tiles via CartoDB Dark Matter (or standard OSM tiles)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>'
        }).addTo(map);

        // Hyper-local news payload for Greater Kochi region
        const kochiNews = [
            {
                lat: 9.9674, lon: 76.2449,
                location: "Fort Kochi",
                category: "Infrastructure & Civics",
                title: "HC Directs Kochi Corporation on Footpath Upkeep Protocol",
                source: "The Hindu",
                time: "1 hour ago",
                url: "https://www.thehindu.com/news/national/kerala/hc-directs-kochi-corporation-to-ready-protocol-on-upkeep-of-footpaths/article71291684.ece"
            },
            {
                lat: 9.9830, lon: 76.2750,
                location: "Kacheripady",
                category: "Emergency / Public Safety",
                title: "Fire Services Respond to Incident at Kacheripady Naval Quarters",
                source: "The Hindu",
                time: "1 day ago",
                url: "https://www.thehindu.com/news/national/kerala/fire-at-naval-quarters-at-kacheripady-in-kochi/article71286508.ece"
            },
            {
                lat: 9.9691, lon: 76.3180,
                location: "Vytilla Junction",
                category: "Transport & Transit",
                title: "Uber Drivers Launch Fresh Strike Over Demand Discussions",
                source: "The Hindu",
                time: "Today",
                url: "https://www.thehindu.com/news/national/kerala/uber-drivers-launch-fresh-strike-in-kochi/article71289252.ece"
            },
            {
                lat: 10.0159, lon: 76.3419,
                location: "Kakkanad InfoPark",
                category: "Tech & Corporate",
                title: "IT Park Expands Green Infrastructure & Smart Mobility Feeds",
                source: "Times of India",
                time: "3 hours ago",
                url: "https://timesofindia.indiatimes.com/city/kochi"
            },
            {
                lat: 10.1004, lon: 76.3570,
                location: "Aluva",
                category: "Law & Order",
                title: "MVD Launches Enforcement Drive Against Unregistered Bike Taxis",
                source: "The Hindu",
                time: "Yesterday",
                url: "https://www.thehindu.com/news/national/kerala/mvd-launches-crackdown-on-illegal-bike-taxis-in-kochi/article71285804.ece"
            },
            {
                lat: 9.9801, lon: 76.2760,
                location: "Marine Drive",
                category: "Civic & Environment",
                title: "Corporation Moots New Waterway & Holdings Utilization Project",
                source: "Metro Times",
                time: "4 hours ago",
                url: "https://timesofindia.indiatimes.com/city/kochi"
            },
            {
                lat: 10.0538, lon: 76.3110,
                location: "Kalamassery",
                category: "Metro & Urban Transit",
                title: "Kochi Metro Records Peak Operational Profits on Phase Expansion",
                source: "Times of India",
                time: "5 hours ago",
                url: "https://timesofindia.indiatimes.com/city/kochi"
            }
        ];

        // Loop through news payload and drop pins on map
        kochiNews.forEach(news => {
            const marker = L.marker([news.lat, news.lon]).addTo(map);
            
            const popupContent = `
                <div class="news-card">
                    <div class="category">${news.category}</div>
                    <h3>${news.title}</h3>
                    <p><strong>${news.location}</strong> • ${news.source}</p>
                    <p style="color:#888; font-size:11px;">Updated ${news.time}</p>
                    <a href="${news.url}" target="_blank">Read Full Story &rarr;</a>
                </div>
            `;
            marker.bindPopup(popupContent);
        });
    </script>
</body>
</html>
